tryCode .toUpperCase() .split('') .map(char=>127397 + char.charCodeAt(0)); return String.fromCodePoint(...codePoints);} function extractHost(line){ line=line.trim(); if (line.startsWith('vmess://')){ try{ let b64Part=line.substring(8).split('#')[0]; b64Part +='='.repeat((4 - b64Part.length % 4) % 4); let jsonString=decodeURIComponent(escape(atob(b64Part))); let configObj=JSON.parse(jsonString); return configObj.add || null;} catch (e){ return null;}} else if (line.startsWith('vless://') || line.startsWith('trojan://') || line.startsWith('ss://')){ try{ let parts=line.split('@'); if (parts.length >1){ let hostPort=parts[1].split('/')[0].split('?')[0].split('#')[0]; let host=hostPort.lastIndexOf(':') !==-1 ? hostPort.substring(0, hostPort.lastIndexOf(':')) : hostPort; return host.replace(/[\[\]]/g, '');}} catch (e){ return null;}} return null;} async function resolveHostToIP(host){ if (!host) return null; const isIP=/^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$/.test(host) || host.includes(':'); if (isIP) return host; try{ let response=await fetch(`https://cloudflare-dns.com/dns-query?name=${encodeURIComponent(host)}&type=A`,{ headers:{ 'Accept': 'application/dns-json'}}); if (response.ok){ let data=await response.json(); if (data.Answer && data.Answer.length >0){ let record=data.Answer.find(ans=>ans.type===1); if (record) return record.data;}}} catch (e){} return null;} async function processServers(){ const text=document.getElementById('textInput').value; if (!text.trim()){ showToast('لطفاً فایلی انتخاب کنید یا محتوایی وارد نمایید.', true); return;} const useGeoIP=document.getElementById('geoIPCheckbox').checked; const usePersian=document.getElementById('persianCheckbox').checked; const useUnique=document.getElementById('uniqueCheckbox').checked; let lines=text.split('\n'); if (useUnique){ let seen=new Set(); let uniqueLines=[]; for (let line of lines){ let trimmed=line.trim(); if (!trimmed) continue; let coreConfig=trimmed.split('#')[0].trim(); if (!seen.has(coreConfig)){ seen. rs[cc]).padStart(2, '0'); newName=` 🛡️${paddedNum} ${flag} ${displayName}`;} else{ if (!tempCounters['GLOBAL']) tempCounters['GLOBAL']=1; else tempCounters['GLOBAL']++; let paddedGlobal=String(tempCounters['GLOBAL']).padStart(2, '0'); newName=`ســـــــرور ${paddedGlobal}`;} let finalLine=trimmed; if (trimmed.startsWith('vmess://')){ try{ let b64Part=trimmed.substring(8).split('#')[0]; b64Part +='='.repeat((4 - b64Part.length % 4) % 4); let jsonString=decodeURIComponent(escape(atob(b64Part))); let configObj=JSON.parse(jsonString); configObj.ps=newName; let newJsonString=JSON.stringify(configObj); let newBase64=btoa(unescape(encodeURIComponent(newJsonString))); finalLine='vmess://' + newBase64;} catch (e){ finalLine=trimmed.includes('#') ? trimmed.substring(0, trimmed.lastIndexOf('#')) + '#' + newName : trimmed + '#' + newName;}} else{ finalLine=trimmed.includes('#') ? trimmed.substring(0, trimmed.lastIndexOf('#')) + '#' + newName : trimmed + '#' + newName;} processedItems.push({ countryName: cName, line: finalLine});}); if (useGeoIP){ processedItems.sort((a, b)=>{ if (a.countryName==='Unknown') return 1; if (b.countryName==='Unknown') return -1; return a.countryName.localeCompare(b.countryName);});} const resultText=processedItems.map(item=>item.line).join('\n'); document.getElementById('outputInput').value=resultText; loading.style.display='none'; btn.disabled=false; document.getElementById('outputSection').style.display='block'; const blob=new Blob([resultText],{ type: 'text/plain;charset=utf-8'}); const url=URL.createObjectURL(blob); document.getElementById('downloadLink').href=url;} </script></body></html>
